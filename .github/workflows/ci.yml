name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so drift from Dungeon's main shows up even when Worldsmith itself is quiet.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Program

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  dungeon-format:
    # Worldsmith must write worlds Dungeon loads unchanged: fail when Dungeon's world format has moved on from the
    # vendored copy (fix: run scripts/sync_format.py against a Dungeon checkout and check the tests).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vantaloomin/prosperos-dungeon
          ref: main
          path: dungeon
          persist-credentials: false
          sparse-checkout: |
            Program/dungeon/errors.py
            Program/dungeon/packages.py
            Program/dungeon/world/schema.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_format.py ../dungeon --check
